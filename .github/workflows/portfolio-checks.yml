name: Portfolio Checks

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portfolio:
    name: Build and test portfolio
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    env:
      APP_ENV: testing
      APP_DEBUG: "true"
      APP_URL: http://localhost
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      LOG_CHANNEL: stderr

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: mbstring, dom, xml, xmlwriter, pdo_sqlite, intl, bcmath, zip
          tools: composer:v2
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Prepare Laravel directories and environment
        run: |
          cp .env.example .env

          mkdir -p bootstrap/cache \
            storage/framework/cache/data \
            storage/framework/sessions \
            storage/framework/views \
            storage/logs \
            tests/Unit

          rm -f bootstrap/cache/*.php public/hot

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Generate temporary application key
        run: php artisan key:generate --force

      - name: Install frontend dependencies
        run: npm ci

      - name: Build production assets
        run: npm run build

      - name: Clear Laravel configuration and views
        run: |
          php artisan config:clear
          php artisan view:clear

      - name: Run portfolio checks
        run: php artisan test --filter=PortfolioPagesTest

      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium

      - name: Run browser checks
        run: npm run test:browser

      - name: Upload browser reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-browser-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          if-no-files-found: ignore
